<div class="col-md-4 mb-4">
  <div class="card h-100 shadow-sm post-card">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" class="card-img-top" alt="{{ post.title }}">
    {% else %}
      <div class="bg-secondary text-white text-center py-5">No Image</div>
    {% endif %}
    <div class="card-body">
      <h5 class="card-title">{{ post.title }}</h5>
      <p class="text-muted small">By <a href="{% url 'author_posts' post.author.username %}">{{ post.author.username }}</a> · {{ post.created_at|date:"M d, Y" }}</p>
      <p class="card-text">{{ post.content|truncatewords:20 }}</p>
      <a href="{% url 'post_detail' post.slug %}" class="btn btn-primary btn-sm">Read more</a>
      {% if request.user.is_authenticated and post.author_id == request.user.id %}
        <a href="{% url 'post_edit' post.slug %}" class="btn btn-outline-secondary btn-sm">Edit</a>
        <a href="{% url 'post_delete' post.slug %}" class="btn btn-outline-danger btn-sm">Delete</a>
      {% endif %}
    </div>
  </div>
</div>
