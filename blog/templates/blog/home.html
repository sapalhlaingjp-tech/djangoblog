{% extends 'blog/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<h1>Welcome {{ title }}</h1>
<p>Very Nice, Very very clean</p>

<div class="row mt-4">
{% for post in posts %}
  <div class="col-md-4 mb-4">
    <div class="card">
      {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">
      {% endif %}
      <div class="card-body">
        <h5 class="card-title">{{ post.title }}</h5>
        <a href="{% url 'post_detail' post.slug %}" class="btn btn-primary btn-sm">Read more</a>
      </div>
    </div>
  </div>
{% endfor %}
</div>

{% endblock %}
